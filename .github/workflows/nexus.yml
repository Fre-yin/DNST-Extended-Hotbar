name: Nexus Mods

# Uploads the ZIPs of a published GitHub release as new versions of the two existing
# main files on the Nexus Mods page (BepInEx and MelonLoader), then sets the mod page
# summary and description from .github/nexus/. Needs the repository secret
# NEXUSMODS_API_KEY. "page" updates only the mod page, without uploading files.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.2
        required: true
      files:
        description: Files to upload ("page" updates only the mod page text)
        type: choice
        options: [both, bepinex, melon, page]
        default: both

permissions:
  contents: read

concurrency:
  group: nexus-mods
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      FILES: ${{ inputs.files || 'both' }}
      # Public IDs from https://www.nexusmods.com/dungeonsettlers/mods/5?tab=files:
      # the mod page and the 1.0.1 versions of its two main files. The upload API
      # needs its own IDs, which are looked up from these on every run.
      NEXUS_GAME: dungeonsettlers
      NEXUS_MOD: '5'
      NEXUS_VERSION_BEPINEX: '25'
      NEXUS_VERSION_MELON: '24'
    steps:
      - name: Check settings
        env:
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then echo "::error::Missing repository secret NEXUSMODS_API_KEY"; exit 1; fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Unexpected tag: $TAG"; exit 1; fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Look up Nexus Mods IDs
        env:
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          api() { curl --silent --show-error --fail-with-body -H "apikey: $API_KEY" -H "Accept: application/json" "https://api.nexusmods.com/v3/games/$NEXUS_GAME/$1"; }
          mod=$(api "mods/$NEXUS_MOD" | jq -r '.data.id // empty')
          bepinex=$(api "mod-file-versions/$NEXUS_VERSION_BEPINEX" | jq -r '.data.file.id // empty')
          melon=$(api "mod-file-versions/$NEXUS_VERSION_MELON" | jq -r '.data.file.id // empty')
          if [ -z "$mod" ] || [ -z "$bepinex" ] || [ -z "$melon" ]; then echo "::error::Could not look up the Nexus Mods IDs"; exit 1; fi
          echo "Mod $mod, BepInEx file $bepinex, MelonLoader file $melon"
          { echo "MOD_ID=$mod"; echo "FILE_ID_BEPINEX=$bepinex"; echo "FILE_ID_MELON=$melon"; } >> "$GITHUB_ENV"

      - name: Check out changelog and page texts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            .github/nexus-changelog
            .github/nexus
          persist-credentials: false

      - name: Download release files
        if: env.FILES != 'page'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir release \
            --pattern "Extended-Hotbar-BepInEx-$VERSION.zip" --pattern "Extended-Hotbar-$VERSION.zip" --pattern SHA256SUMS.txt
          cd release
          sha256sum --check SHA256SUMS.txt

      - name: Read changelog
        if: env.FILES != 'page'
        run: |
          file=".github/nexus-changelog/$VERSION.txt"
          if [ ! -s "$file" ]; then echo "::error::Missing changelog $file"; exit 1; fi
          {
            echo 'CHANGELOG<<NEXUS_CHANGELOG_END'
            cat "$file"
            echo 'NEXUS_CHANGELOG_END'
          } >> "$GITHUB_ENV"

      - name: Upload BepInEx
        if: env.FILES == 'both' || env.FILES == 'bepinex'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.FILE_ID_BEPINEX }}
          filename: release/Extended-Hotbar-BepInEx-${{ env.VERSION }}.zip
          display_name: Extended Hotbar - BepInEx
          description: For BepInEx 6 Unity IL2CPP x64. Merge the BepInEx folder into the game folder and keep the plugin DLL and artwork together. Back up your saves first. No demo save included.
          version: ${{ env.VERSION }}
          category: main
          archive_existing_version: true
          update_mod_version: true
          mod_id: ${{ env.MOD_ID }}
          changelog: ${{ env.CHANGELOG }}

      - name: Upload MelonLoader
        if: env.FILES == 'both' || env.FILES == 'melon'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ env.FILE_ID_MELON }}
          filename: release/Extended-Hotbar-${{ env.VERSION }}.zip
          display_name: Extended Hotbar - MelonLoader
          description: For MelonLoader 0.7.3. Merge the Mods folder into the game folder and keep the DLL and artwork together. Back up your saves first. The optional demo save is never imported automatically.
          version: ${{ env.VERSION }}
          category: main
          archive_existing_version: true

      # Nexus Mods API v3, PATCH /mods/{id} (marked experimental): replaces the summary and
      # the BBCode description, the same as saving them in the mod page editor.
      - name: Update mod page
        if: env.FILES == 'both' || env.FILES == 'page'
        env:
          API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
        run: |
          summary=.github/nexus/summary.txt
          description=.github/nexus/description.bbcode
          if [ ! -s "$summary" ] || [ ! -s "$description" ]; then echo "::error::Missing $summary or $description"; exit 1; fi
          jq -n --rawfile summary "$summary" --rawfile description "$description" \
            '{summary: ($summary | rtrimstr("\n")), description: ($description | rtrimstr("\n"))}' > page.json
          curl --silent --show-error --fail-with-body -X PATCH \
            -H "apikey: $API_KEY" -H "Content-Type: application/json" -H "Accept: application/json" \
            --data @page.json "https://api.nexusmods.com/v3/mods/$MOD_ID"
          echo "Mod page summary and description updated"
